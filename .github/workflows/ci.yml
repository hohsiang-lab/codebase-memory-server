name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE: docker.io/devhohing/codebase-memory-server
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require committed lockfile
        run: git ls-files --error-unmatch Cargo.lock
      - uses: docker/setup-buildx-action@v3
      - name: Build image and run Rust tests
        run: docker buildx build --platform linux/${{ matrix.arch }} --load -t cbm:ci .
      - name: Verify actual MCP endpoint and catalog isolation
        run: bash tests/smoke.sh cbm:ci
      - name: Login to Docker Hub
        if: github.repository == 'hohsiang-lab/codebase-memory-server' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Publish tested architecture
        if: github.repository == 'hohsiang-lab/codebase-memory-server' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker tag cbm:ci "$tag"
          docker push "$tag"

  publish:
    if: github.repository == 'hohsiang-lab/codebase-memory-server' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Publish multi-platform manifest
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"

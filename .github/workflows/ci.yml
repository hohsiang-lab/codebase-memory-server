name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require committed lockfile
        run: git ls-files --error-unmatch Cargo.lock
      - uses: docker/setup-buildx-action@v3
      - name: Build image and run Rust tests
        run: docker buildx build --platform linux/${{ matrix.arch }} --load -t cbm:ci .
      - name: Verify actual MCP endpoint and catalog isolation
        run: bash tests/smoke.sh cbm:ci
      - name: Verify Docker Hub publishing configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKER_HUB_USERNAME }}
        run: |
          if [[ -z "$DOCKER_HUB_USERNAME" || -z "$DOCKER_HUB_TOKEN" ]]; then
            echo 'Docker Hub credentials are unavailable. Check organization secret access for this repository.' >&2
            exit 1
          fi
          if [[ ! "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo 'Invalid Docker Hub namespace. Set DOCKERHUB_NAMESPACE if it differs from the login account.' >&2
            exit 1
          fi
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Publish tested architecture
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKER_HUB_USERNAME }}/codebase-memory-server
        run: |
          test -f Cargo.lock
          git ls-files --error-unmatch Cargo.lock >/dev/null
          image="$IMAGE"
          tag="$image:sha-$GITHUB_SHA-$ARCH"
          docker tag cbm:ci "$tag"
          docker push "$tag"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Publish multi-platform manifest
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKER_HUB_USERNAME }}/codebase-memory-server
        run: |
          image="$IMAGE"
          docker buildx imagetools create \
            -t "$image:latest" -t "$image:sha-$GITHUB_SHA" \
            "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:sha-$GITHUB_SHA"
